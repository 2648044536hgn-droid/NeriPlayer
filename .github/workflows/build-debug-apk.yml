name: Build Debug APK

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch or commit SHA to build
        required: true
        default: passthrough
        type: string

permissions:
  contents: read

env:
  GRADLE_OPTS: -Dorg.gradle.caching=true

jobs:
  build:
    name: Assemble debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 1
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v5

      - name: Install Maven Central mirror
        run: install -Dm644 .github/scripts/maven-central-mirror.init.gradle "${GRADLE_USER_HOME:-$HOME/.gradle}/init.d/maven-central-mirror.init.gradle"

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Install Android NDK
        uses: ./.github/actions/android-ndk

      - name: Assemble debug
        run: ./gradlew :app:assembleDebug --warning-mode all --stacktrace

      - name: Collect APKs
        run: |
          set -euo pipefail
          mkdir -p out
          find app/build/outputs/apk/debug -name '*.apk' -exec cp {} out/ \;
          ls -lh out/

      - name: Upload APK
        uses: actions/upload-artifact@v6
        with:
          name: neriplayer-debug-apk
          path: out/*.apk
          if-no-files-found: error
          compression-level: 0
